openapi: 3.0.0
info:
  title: NodeApiCrud - Auto Management API
  description: Professional CRUD API for managing automobiles with Node.js and Express.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /autos:
    get:
      summary: Get all autos
      parameters:
        - in: query
          name: categoria
          schema:
            type: string
          description: Filter by category
        - in: query
          name: nombre
          schema:
            type: string
          description: Filter by name
      responses:
        "200":
          description: A list of autos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Auto"
    post:
      summary: Create a new auto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoInput"
      responses:
        "201":
          description: Auto created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auto"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /autos/{id}:
    get:
      summary: Get auto by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auto details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auto"
        "404":
          description: Auto not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update auto by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoInput"
      responses:
        "200":
          description: Auto updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auto"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Auto not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete auto by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Auto deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Auto not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Auto:
      type: object
      required:
        - nombre
        - precio
        - categoria
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Toyota Corolla"
        precio:
          type: number
          example: 450000
        categoria:
          type: string
          example: "Sedan"
        stock:
          type: integer
          example: 10
    AutoInput:
      type: object
      required:
        - nombre
        - precio
        - categoria
      properties:
        nombre:
          type: string
          example: "Toyota Corolla"
        precio:
          type: number
          example: 450000
        categoria:
          type: string
          example: "Sedan"
        stock:
          type: integer
          example: 10
    Error:
      type: object
      properties:
        status:
          type: string
          example: "fail"
        message:
          type: string
          example: "Auto no encontrado"
